prefixes:
  bido: http://purl.org/spar/bido/
  cito: http://purl.org/spar/cito/
  co: http://purl.org/co/
  datacite: http://purl.org/spar/datacite/
  dcterms: http://purl.org/dc/terms/
  fabio: http://purl.org/spar/fabio/
  foaf: http://xmlns.com/foaf/0.1/
  frapo: http://purl.org/cerif/frapo/
  frbr: http://purl.org/vocab/frbr/core#
  literal: http://www.essepuntato.it/2010/06/literalreification/
  prism: http://prismstandard.org/namespaces/basic/2.0/
  pro: http://purl.org/spar/pro/
  prov: http://www.w3.org/ns/prov#
  pso: http://purl.org/spar/pso/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  skos: http://www.w3.org/2004/02/skos/core#
  xsd: http://www.w3.org/2001/XMLSchema#

mappings:
  research_product:
    sources:
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the primary source (OpenCitations first)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 ELSE 1 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                   (ROW_NUMBER() OVER (PARTITION BY rec ORDER BY prio, srck) = 1) AS is_primary,
                   -- offsets keep manifestation/topic/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.topics'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS t_off,
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          )
          SELECT w_iri,
                 COALESCE(CAST((CASE FIRST_VALUE(json_extract_string(p, '$.product_type') IGNORE NULLS) OVER (PARTITION BY w_iri ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) WHEN 'literature' THEN 'http://purl.org/spar/fabio/ScholarlyWork' WHEN 'research data' THEN 'http://purl.org/spar/fabio/Dataset' WHEN 'research software' THEN 'http://purl.org/spar/fabio/Software' WHEN 'software' THEN 'http://purl.org/spar/fabio/Software' END) AS VARCHAR), '') AS ptype
          FROM works
    s: $(w_iri)
    po:
      - [a, fabio:Work]
      - [a, '$(ptype)~iri']

  edges:
    sources:
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the primary source (OpenCitations first)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 ELSE 1 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                   (ROW_NUMBER() OVER (PARTITION BY rec ORDER BY prio, srck) = 1) AS is_primary,
                   -- offsets keep manifestation/topic/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.topics'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS t_off,
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          mfs AS (
            SELECT w_iri, mf.value AS m,
                   w_iri || '/manifestation/' || CAST(CAST(mf.key AS INTEGER) + 1 + m_off AS VARCHAR) AS m_iri,
                   json_extract(mf.value, '$.biblio.in') AS vv
            FROM works, json_each(p, '$.manifestations') AS mf
          ),
          ven AS (
            SELECT m_iri, vv AS v, (CASE WHEN (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END)) END) AS v_iri FROM mfs WHERE vv IS NOT NULL
          ),
          ctb0 AS (
            SELECT rec, prio, w_iri, ct.value AS c,
                   CAST(ct.key AS INTEGER) + 1 + c_off AS n,
                   json_extract(ct.value, '$.by') AS byv,
                   (CASE WHEN (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END)) END) AS own_a_iri,
                   json_extract_string(ct.value, '$.role') AS role,
                   -- normalised name: lowercase, no accents, no parentheses, letters/commas/spaces only
                   trim(regexp_replace(regexp_replace(strip_accents(lower(regexp_replace(COALESCE(CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.name') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END, ''), '\(.*?\)', '', 'g'))), '[^a-z, ]', '', 'g'), '\s+', ' ', 'g')) AS nn
            FROM works, json_each(p, '$.contributions') AS ct
          ),
          ctbn AS (
            SELECT *,
                   replace(replace(nn, ' ', ''), ',', '') AS cmp,
                   replace(fpart, ' ', '') AS fam,
                   split_part(fpart, ' ', 1) AS fam1,
                   (CASE WHEN NOT contains(nn, ',') AND prio > 0 THEN regexp_extract(nn, '([a-z]+)$', 1) ELSE replace(fpart, ' ', '') END) AS fam_alt
            FROM (
              SELECT *,
                     -- family part: 'Family, Given'; OpenCitations 'Family Given'; otherwise 'Given Family'
                     (CASE WHEN contains(nn, ',') THEN trim(split_part(nn, ',', 1))
                           WHEN prio = 0 THEN split_part(nn, ' ', 1)
                           ELSE trim(regexp_replace(nn, '^[a-z]+ ?', '')) END) AS fpart,
                     (CASE WHEN contains(nn, ',') THEN split_part(trim(split_part(nn, ',', 2)), ' ', 1)
                           WHEN prio = 0 THEN split_part(nn, ' ', 2)
                           WHEN contains(nn, ' ') THEN split_part(nn, ' ', 1)
                           ELSE '' END) AS giv
              FROM ctb0
            )
          ),
          -- a secondary-source contributor is the same agent as a primary-source one (same work,
          -- same role) when full names coincide (score 3), or family names coincide (2) or share the
          -- first token (1) and the given names are compatible (one is a prefix of the other, e.g.
          -- 'p' / 'philippe'); only the unique best candidate is kept
          cand AS (
            SELECT g.rec, g.n AS g_n, o.n AS o_n, o.own_a_iri AS o_a_iri,
                   (CASE WHEN g.cmp = o.cmp THEN 3
                         WHEN (g.fam = o.fam OR g.fam_alt = o.fam) THEN 2
                         ELSE 1 END) AS score
            FROM ctbn g JOIN ctbn o
              ON g.rec = o.rec AND o.prio = 0 AND g.prio > 0 AND g.role IS NOT DISTINCT FROM o.role
             AND g.cmp <> '' AND o.own_a_iri IS NOT NULL
             AND (g.cmp = o.cmp
                  OR ((g.fam = o.fam OR g.fam_alt = o.fam OR (g.fam1 <> '' AND (g.fam1 = o.fam1 OR g.fam_alt = o.fam1)))
                      AND (g.giv = '' OR o.giv = '' OR starts_with(g.giv, o.giv) OR starts_with(o.giv, g.giv))))
          ),
          best AS (
            SELECT rec, g_n, o_n, o_a_iri FROM cand
            QUALIFY score = MAX(score) OVER (PARTITION BY rec, g_n)
                AND COUNT(*) OVER (PARTITION BY rec, g_n, score) = 1
          ),
          ctb AS (
            SELECT x.w_iri, x.c,
                   x.w_iri || '/contribution/' || CAST(COALESCE(b.o_n, x.n) AS VARCHAR) AS c_iri,
                   x.byv,
                   COALESCE(b.o_a_iri, x.own_a_iri) AS a_iri,
                   (b.o_n IS NOT NULL) AS dup
            FROM ctbn x LEFT JOIN best b ON b.rec = x.rec AND b.g_n = x.n AND x.prio > 0
          ),
          aff AS (
            SELECT c_iri, da.value AS av, (CASE WHEN (CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END)) END) AS af_iri
            FROM ctb, json_each((CASE WHEN json_type(json_extract(c, '$.declared_affiliations')) = 'ARRAY' THEN json_extract(c, '$.declared_affiliations') WHEN json_extract(c, '$.declared_affiliations') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(c, '$.declared_affiliations')) END)) AS da
          ),
          tps AS (
            SELECT w_iri, tp.value AS t,
                   w_iri || '/topic/' || CAST(CAST(tp.key AS INTEGER) + 1 + t_off AS VARCHAR) AS t_iri
            FROM works, json_each(p, '$.topics') AS tp
          ),
          prv AS (
            SELECT t_iri, t, pr.value AS pv,
                   t_iri || '/provenance/' || CAST(CAST(pr.key AS INTEGER) + 1 AS VARCHAR) AS pv_iri,
                   json_extract(pr.value, '$.associated_with') AS pav,
                   (CASE WHEN (CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END)) END) AS pa_iri
            FROM tps, json_each((CASE WHEN json_type(json_extract(t, '$.provenance')) = 'ARRAY' THEN json_extract(t, '$.provenance') WHEN json_extract(t, '$.provenance') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(t, '$.provenance')) END)) AS pr
          ),
          sts AS (
            SELECT m_iri || '/' || k AS st_iri, m_iri, k,
                   (CASE json_extract_string(sv, '$.status')
              WHEN 'open' THEN 'http://purl.org/spar/pso/open-access'
              WHEN 'closed' THEN 'http://purl.org/spar/pso/closed-access'
              WHEN 'embargoed' THEN 'http://purl.org/spar/pso/embargoed'
              WHEN 'restricted' THEN 'http://purl.org/spar/pso/restricted-access'
              WHEN 'retricted' THEN 'http://purl.org/spar/pso/restricted-access'
              WHEN 'unavailable' THEN 'http://purl.org/spar/pso/unpublished'
              WHEN 'peer reviewed' THEN 'http://purl.org/spar/pso/peer-reviewed'
              WHEN 'under review' THEN 'http://purl.org/spar/pso/under-review'
            END) AS status_iri,
                   json_extract_string(sv, '$.description') AS descr
            FROM (
              SELECT m_iri, 'access_rights' AS k, json_extract(m, '$.access_rights') AS sv FROM mfs
              UNION ALL
              SELECT m_iri, 'peer_review', json_extract(m, '$.peer_review') FROM mfs
            ) WHERE sv IS NOT NULL
          )
          SELECT s, pred, obj FROM (
            -- Research product -> manifestazioni, contributi, topic
            SELECT w_iri AS s, 'http://purl.org/vocab/frbr/core#realization' AS pred, m_iri AS obj FROM mfs
            UNION ALL SELECT w_iri, 'http://purl.org/spar/pro/isRelatedToRoleInTime', c_iri FROM ctb WHERE NOT dup
            UNION ALL SELECT w_iri, 'http://purl.org/spar/bido/holdsBibliometricDataInTime', t_iri FROM tps
            -- topic -> provenance
            UNION ALL SELECT t_iri, 'http://www.w3.org/ns/prov#wasGeneratedBy', pv_iri FROM prv
            -- contributo -> affiliazioni dichiarate
            UNION ALL SELECT c_iri, 'http://purl.org/spar/pro/relatesToOrganization', af_iri FROM aff
            -- manifestazione -> tipo, venue, pagine, stati, data source
            UNION ALL SELECT m_iri, 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type', json_extract_string(m, '$.type.class') FROM mfs
            UNION ALL SELECT m_iri, 'http://purl.org/vocab/frbr/core#partOf', v_iri FROM ven
            UNION ALL SELECT m_iri, 'http://purl.org/vocab/frbr/core#embodiment', m_iri || '/pages'
                      FROM mfs WHERE json_extract(m, '$.biblio.pages') IS NOT NULL
            UNION ALL SELECT m_iri, 'http://purl.org/spar/pso/holdsStatusInTime', st_iri FROM sts
            UNION ALL SELECT m_iri, 'http://www.w3.org/ns/dcat#accessService',
                             (CASE WHEN (CASE WHEN json_type(json_extract(m, '$.biblio.hosting_data_source')) = 'OBJECT' THEN json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$.local_identifier') ELSE json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(m, '$.biblio.hosting_data_source')) = 'OBJECT' THEN json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$.local_identifier') ELSE json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(m, '$.biblio.hosting_data_source')) = 'OBJECT' THEN json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$.local_identifier') ELSE json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(m, '$.biblio.hosting_data_source')) = 'OBJECT' THEN json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$.local_identifier') ELSE json_extract_string(json_extract(m, '$.biblio.hosting_data_source'), '$') END)) END) FROM mfs
            -- relazioni tra research product (related_products), finanziamenti, organizzazioni
            UNION ALL SELECT w_iri, 'http://purl.org/spar/cito/cites', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.related_products.cites')) = 'ARRAY' THEN json_extract(p, '$.related_products.cites') WHEN json_extract(p, '$.related_products.cites') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.related_products.cites')) END)) AS r
            UNION ALL SELECT w_iri, 'http://purl.org/vocab/frbr/core#supplement', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.related_products.is_supplemented_by')) = 'ARRAY' THEN json_extract(p, '$.related_products.is_supplemented_by') WHEN json_extract(p, '$.related_products.is_supplemented_by') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.related_products.is_supplemented_by')) END)) AS r
            UNION ALL SELECT w_iri, 'http://purl.org/spar/cito/isDocumentedBy', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.related_products.is_documented_by')) = 'ARRAY' THEN json_extract(p, '$.related_products.is_documented_by') WHEN json_extract(p, '$.related_products.is_documented_by') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.related_products.is_documented_by')) END)) AS r
            UNION ALL SELECT w_iri, 'http://purl.org/vocab/frbr/core#revisionOf', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.related_products.is_new_version_of')) = 'ARRAY' THEN json_extract(p, '$.related_products.is_new_version_of') WHEN json_extract(p, '$.related_products.is_new_version_of') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.related_products.is_new_version_of')) END)) AS r
            UNION ALL SELECT w_iri, 'http://purl.org/vocab/frbr/core#partOf', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.related_products.is_part_of')) = 'ARRAY' THEN json_extract(p, '$.related_products.is_part_of') WHEN json_extract(p, '$.related_products.is_part_of') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.related_products.is_part_of')) END)) AS r
            UNION ALL SELECT w_iri, 'http://purl.org/cerif/frapo/isFundedBy', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.funding')) = 'ARRAY' THEN json_extract(p, '$.funding') WHEN json_extract(p, '$.funding') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.funding')) END)) AS r
            UNION ALL SELECT w_iri, 'http://purl.org/dc/terms/relation', (CASE WHEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(r.value) = 'OBJECT' THEN json_extract_string(r.value, '$.local_identifier') ELSE json_extract_string(r.value, '$') END)) END)
                      FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.relevant_organisations')) = 'ARRAY' THEN json_extract(p, '$.relevant_organisations') WHEN json_extract(p, '$.relevant_organisations') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(p, '$.relevant_organisations')) END)) AS r
          ) WHERE s IS NOT NULL AND obj IS NOT NULL
    s: $(s)
    po:
      - p: $(pred)
        o: $(obj)~iri

  identifier_link:
    sources: &ids_src
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the primary source (OpenCitations first)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 ELSE 1 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                   (ROW_NUMBER() OVER (PARTITION BY rec ORDER BY prio, srck) = 1) AS is_primary,
                   -- offsets keep manifestation/topic/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.topics'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS t_off,
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          mfs AS (
            SELECT w_iri, mf.value AS m,
                   w_iri || '/manifestation/' || CAST(CAST(mf.key AS INTEGER) + 1 + m_off AS VARCHAR) AS m_iri,
                   json_extract(mf.value, '$.biblio.in') AS vv
            FROM works, json_each(p, '$.manifestations') AS mf
          ),
          ven AS (
            SELECT m_iri, vv AS v, (CASE WHEN (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END)) END) AS v_iri FROM mfs WHERE vv IS NOT NULL
          ),
          ctb0 AS (
            SELECT rec, prio, w_iri, ct.value AS c,
                   CAST(ct.key AS INTEGER) + 1 + c_off AS n,
                   json_extract(ct.value, '$.by') AS byv,
                   (CASE WHEN (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END)) END) AS own_a_iri,
                   json_extract_string(ct.value, '$.role') AS role,
                   -- normalised name: lowercase, no accents, no parentheses, letters/commas/spaces only
                   trim(regexp_replace(regexp_replace(strip_accents(lower(regexp_replace(COALESCE(CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.name') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END, ''), '\(.*?\)', '', 'g'))), '[^a-z, ]', '', 'g'), '\s+', ' ', 'g')) AS nn
            FROM works, json_each(p, '$.contributions') AS ct
          ),
          ctbn AS (
            SELECT *,
                   replace(replace(nn, ' ', ''), ',', '') AS cmp,
                   replace(fpart, ' ', '') AS fam,
                   split_part(fpart, ' ', 1) AS fam1,
                   (CASE WHEN NOT contains(nn, ',') AND prio > 0 THEN regexp_extract(nn, '([a-z]+)$', 1) ELSE replace(fpart, ' ', '') END) AS fam_alt
            FROM (
              SELECT *,
                     -- family part: 'Family, Given'; OpenCitations 'Family Given'; otherwise 'Given Family'
                     (CASE WHEN contains(nn, ',') THEN trim(split_part(nn, ',', 1))
                           WHEN prio = 0 THEN split_part(nn, ' ', 1)
                           ELSE trim(regexp_replace(nn, '^[a-z]+ ?', '')) END) AS fpart,
                     (CASE WHEN contains(nn, ',') THEN split_part(trim(split_part(nn, ',', 2)), ' ', 1)
                           WHEN prio = 0 THEN split_part(nn, ' ', 2)
                           WHEN contains(nn, ' ') THEN split_part(nn, ' ', 1)
                           ELSE '' END) AS giv
              FROM ctb0
            )
          ),
          -- a secondary-source contributor is the same agent as a primary-source one (same work,
          -- same role) when full names coincide (score 3), or family names coincide (2) or share the
          -- first token (1) and the given names are compatible (one is a prefix of the other, e.g.
          -- 'p' / 'philippe'); only the unique best candidate is kept
          cand AS (
            SELECT g.rec, g.n AS g_n, o.n AS o_n, o.own_a_iri AS o_a_iri,
                   (CASE WHEN g.cmp = o.cmp THEN 3
                         WHEN (g.fam = o.fam OR g.fam_alt = o.fam) THEN 2
                         ELSE 1 END) AS score
            FROM ctbn g JOIN ctbn o
              ON g.rec = o.rec AND o.prio = 0 AND g.prio > 0 AND g.role IS NOT DISTINCT FROM o.role
             AND g.cmp <> '' AND o.own_a_iri IS NOT NULL
             AND (g.cmp = o.cmp
                  OR ((g.fam = o.fam OR g.fam_alt = o.fam OR (g.fam1 <> '' AND (g.fam1 = o.fam1 OR g.fam_alt = o.fam1)))
                      AND (g.giv = '' OR o.giv = '' OR starts_with(g.giv, o.giv) OR starts_with(o.giv, g.giv))))
          ),
          best AS (
            SELECT rec, g_n, o_n, o_a_iri FROM cand
            QUALIFY score = MAX(score) OVER (PARTITION BY rec, g_n)
                AND COUNT(*) OVER (PARTITION BY rec, g_n, score) = 1
          ),
          ctb AS (
            SELECT x.w_iri, x.c,
                   x.w_iri || '/contribution/' || CAST(COALESCE(b.o_n, x.n) AS VARCHAR) AS c_iri,
                   x.byv,
                   COALESCE(b.o_a_iri, x.own_a_iri) AS a_iri,
                   (b.o_n IS NOT NULL) AS dup
            FROM ctbn x LEFT JOIN best b ON b.rec = x.rec AND b.g_n = x.n AND x.prio > 0
          ),
          aff AS (
            SELECT c_iri, da.value AS av, (CASE WHEN (CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(da.value) = 'OBJECT' THEN json_extract_string(da.value, '$.local_identifier') ELSE json_extract_string(da.value, '$') END)) END) AS af_iri
            FROM ctb, json_each((CASE WHEN json_type(json_extract(c, '$.declared_affiliations')) = 'ARRAY' THEN json_extract(c, '$.declared_affiliations') WHEN json_extract(c, '$.declared_affiliations') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(c, '$.declared_affiliations')) END)) AS da
          ),
          tps AS (
            SELECT w_iri, tp.value AS t,
                   w_iri || '/topic/' || CAST(CAST(tp.key AS INTEGER) + 1 + t_off AS VARCHAR) AS t_iri
            FROM works, json_each(p, '$.topics') AS tp
          ),
          prv AS (
            SELECT t_iri, t, pr.value AS pv,
                   t_iri || '/provenance/' || CAST(CAST(pr.key AS INTEGER) + 1 AS VARCHAR) AS pv_iri,
                   json_extract(pr.value, '$.associated_with') AS pav,
                   (CASE WHEN (CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(pr.value, '$.associated_with')) = 'OBJECT' THEN json_extract_string(json_extract(pr.value, '$.associated_with'), '$.local_identifier') ELSE json_extract_string(json_extract(pr.value, '$.associated_with'), '$') END)) END) AS pa_iri
            FROM tps, json_each((CASE WHEN json_type(json_extract(t, '$.provenance')) = 'ARRAY' THEN json_extract(t, '$.provenance') WHEN json_extract(t, '$.provenance') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(t, '$.provenance')) END)) AS pr
          ),
          ags AS (
            SELECT a_iri, byv AS a FROM ctb WHERE a_iri IS NOT NULL
            UNION ALL
            SELECT pa_iri, pav FROM prv WHERE pa_iri IS NOT NULL
            UNION ALL
            SELECT af_iri, av FROM aff WHERE af_iri IS NOT NULL
          ),
          h AS (
            SELECT w_iri AS holder, i.value AS i FROM works, json_each(p, '$.identifiers') AS i
            UNION ALL SELECT m_iri, i.value FROM mfs, json_each(m, '$.identifiers') AS i
            UNION ALL SELECT a_iri, i.value FROM ags, json_each((CASE WHEN json_type(json_extract(a, '$.identifiers')) = 'ARRAY' THEN json_extract(a, '$.identifiers') WHEN json_extract(a, '$.identifiers') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(a, '$.identifiers')) END)) AS i
            UNION ALL SELECT v_iri, i.value FROM ven, json_each((CASE WHEN json_type(json_extract(v, '$.identifiers')) = 'ARRAY' THEN json_extract(v, '$.identifiers') WHEN json_extract(v, '$.identifiers') IS NULL THEN CAST('[]' AS JSON) ELSE json_array(json_extract(v, '$.identifiers')) END)) AS i
          )
          SELECT COALESCE(CAST(holder AS VARCHAR), '') AS holder,
                 'https://example.org/skg-if/data/identifier/' || url_encode(json_extract_string(i, '$.scheme')) || '/' || url_encode(json_extract_string(i, '$.value')) AS ident,
                 'http://purl.org/spar/datacite/' || json_extract_string(i, '$.scheme') AS scheme,
                 json_extract_string(i, '$.value') AS val
          FROM h
          WHERE json_extract_string(i, '$.scheme') IS NOT NULL AND json_extract_string(i, '$.value') IS NOT NULL
    s: $(holder)
    po:
      - [datacite:hasIdentifier, '$(ident)~iri']
 
  identifier:
    sources: *ids_src
    s: $(ident)
