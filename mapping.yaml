                   (CASE WHEN (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.local_identifier') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END)) END) AS own_a_iri,
                   json_extract_string(ct.value, '$.role') AS role,
                   -- normalised name: lowercase, no accents, no parentheses, letters/commas/spaces only
                   trim(regexp_replace(regexp_replace(strip_accents(lower(regexp_replace(COALESCE(CASE WHEN json_type(json_extract(ct.value, '$.by')) = 'OBJECT' THEN json_extract_string(json_extract(ct.value, '$.by'), '$.name') ELSE json_extract_string(json_extract(ct.value, '$.by'), '$') END, ''), '\(.*?\)', '', 'g'))), '[^a-z, ]', '', 'g'), '\s+', ' ', 'g')) AS nn
            FROM works, json_each(p, '$.contributions') AS ct
          ),
          ctbn AS (
