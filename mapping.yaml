  venue:
    sources:
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the highest-priority source
          -- (OpenCitations, then OpenAIRE, then GoTriple)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 WHEN 'openaire' THEN 1 ELSE 2 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                     -- offsets keep manifestation/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                     CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          mfs AS (
            SELECT w_iri, prio, mf.value AS m,
                   w_iri || '/manifestation/' || CAST(CAST(mf.key AS INTEGER) + 1 + m_off AS VARCHAR) AS m_iri,
                   json_extract(mf.value, '$.biblio.in') AS vv
            FROM works, json_each(p, '$.manifestations') AS mf WHERE json_type(mf.value) = 'OBJECT'
          ),
          ven0 AS (
            SELECT m_iri, prio, vv AS v, (CASE WHEN (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(vv) = 'OBJECT' THEN json_extract_string(vv, '$.local_identifier') ELSE json_extract_string(vv, '$') END)) END) AS own_v_iri FROM mfs WHERE json_type(vv) IN ('OBJECT', 'VARCHAR')
          ),
          -- venues sharing an ISSN are the same venue (across products and sources):
          -- they all take the IRI of the one from the highest-priority source
          vid AS (
            SELECT DISTINCT own_v_iri, prio, lower(json_extract_string(i.value, '$.value')) AS issn
            FROM ven0, json_each((CASE WHEN json_type(json_extract(v, '$.identifiers')) = 'ARRAY' THEN json_extract(v, '$.identifiers') ELSE CAST('[]' AS JSON) END)) AS i
            WHERE json_extract_string(i.value, '$.scheme') IN ('issn', 'eissn', 'pissn')
          ),
          vcanon AS (
            SELECT a.own_v_iri, split_part(MIN(CAST(b.prio AS VARCHAR) || ' ' || b.own_v_iri), ' ', 2) AS v_iri
            FROM vid a JOIN vid b ON a.issn = b.issn
            GROUP BY a.own_v_iri
          ),
          ven AS (
            SELECT m_iri, v, COALESCE(c.v_iri, ven0.own_v_iri) AS v_iri,
                   COALESCE(c.v_iri <> ven0.own_v_iri, false) AS vdup
            FROM ven0 LEFT JOIN vcanon c ON c.own_v_iri = ven0.own_v_iri
          )
          SELECT v_iri,
                 COALESCE(CAST((CASE json_extract_string(v, '$.type') WHEN 'journal' THEN 'http://purl.org/spar/fabio/Journal' WHEN 'repository' THEN 'http://purl.org/spar/fabio/Repository' WHEN 'conference' THEN 'http://purl.org/spar/fabio/ConferenceProceedings' WHEN 'book' THEN 'http://purl.org/spar/fabio/Book' END) AS VARCHAR), '') AS vtype,
                 COALESCE(CAST(COALESCE(json_extract_string(v, '$.title'), json_extract_string(v, '$.name')) AS VARCHAR), '') AS title
          FROM ven WHERE NOT vdup
    s: $(v_iri)
    po:
      - [a, fabio:ExpressionCollection]
      - [a, '$(vtype)~iri']
      - [dcterms:title, $(title)]

  # --- Grant (OpenAIRE funding): frapo:Grant, as in the SKG-IF JSON-LD context ---
  grant:
    sources:
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the highest-priority source
          -- (OpenCitations, then OpenAIRE, then GoTriple)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 WHEN 'openaire' THEN 1 ELSE 2 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                     -- offsets keep manifestation/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                     CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          grs AS (
            SELECT w_iri, g.value AS gr, (CASE WHEN (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END)) END) AS g_iri
            FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.funding')) = 'ARRAY' THEN json_extract(p, '$.funding') ELSE CAST('[]' AS JSON) END)) AS g
            WHERE json_type(g.value) = 'OBJECT'
          )
          SELECT DISTINCT g_iri,
                 COALESCE(CAST(NULLIF(json_extract_string(gr, '$.grant_number'), 'unidentified') AS VARCHAR), '') AS number,
                 COALESCE(CAST(json_extract_string(gr, '$.acronym') AS VARCHAR), '') AS acronym,
                 COALESCE(CAST(json_extract_string(gr, '$.funding_stream') AS VARCHAR), '') AS stream,
                 COALESCE(CAST(json_extract_string(gr, '$.currency') AS VARCHAR), '') AS currency,
                 -- OpenAIRE uses 0 when the amount is unknown
                 COALESCE(CAST((CASE WHEN TRY_CAST(json_extract_string(gr, '$.funded_amount') AS DOUBLE) > 0 THEN json_extract_string(gr, '$.funded_amount') END) AS VARCHAR), '') AS amount,
                 COALESCE(CAST((CASE WHEN json_extract_string(gr, '$.website') LIKE 'http%' THEN json_extract_string(gr, '$.website') END) AS VARCHAR), '') AS website,
                 COALESCE(CAST((CASE WHEN json_type(json_extract(gr, '$.funding_agency')) = 'OBJECT' THEN (CASE WHEN (CASE WHEN json_type(json_extract(gr, '$.funding_agency')) = 'OBJECT' THEN json_extract_string(json_extract(gr, '$.funding_agency'), '$.local_identifier') ELSE json_extract_string(json_extract(gr, '$.funding_agency'), '$') END) LIKE 'http://%' OR (CASE WHEN json_type(json_extract(gr, '$.funding_agency')) = 'OBJECT' THEN json_extract_string(json_extract(gr, '$.funding_agency'), '$.local_identifier') ELSE json_extract_string(json_extract(gr, '$.funding_agency'), '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(json_extract(gr, '$.funding_agency')) = 'OBJECT' THEN json_extract_string(json_extract(gr, '$.funding_agency'), '$.local_identifier') ELSE json_extract_string(json_extract(gr, '$.funding_agency'), '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(json_extract(gr, '$.funding_agency')) = 'OBJECT' THEN json_extract_string(json_extract(gr, '$.funding_agency'), '$.local_identifier') ELSE json_extract_string(json_extract(gr, '$.funding_agency'), '$') END)) END) END) AS VARCHAR), '') AS agency,
                 (CASE WHEN json_type(json_extract(gr, '$.duration')) = 'OBJECT' THEN g_iri || '/duration' ELSE '' END) AS duration
          FROM grs
    s: $(g_iri)
    po:
      - [a, frapo:Grant]
      - [frapo:hasGrantNumber, $(number), xsd:string]
      - [frapo:hasAcronym, $(acronym)]
      - [frapo:hasCallIdentifier, $(stream)]
      - [frapo:hasCurrencyCode, $(currency), xsd:string]
      - [frapo:hasCurrency, $(amount), xsd:float]
      - [foaf:homepage, '$(website)~iri']
      - [frapo:hasFundingAgency, '$(agency)~iri']
      - [dcterms:temporal, '$(duration)~iri']

  grant_duration:
    sources: &grant_rel_src
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the highest-priority source
          -- (OpenCitations, then OpenAIRE, then GoTriple)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 WHEN 'openaire' THEN 1 ELSE 2 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                     -- offsets keep manifestation/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                     CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          grs AS (
            SELECT w_iri, g.value AS gr, (CASE WHEN (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END)) END) AS g_iri
            FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.funding')) = 'ARRAY' THEN json_extract(p, '$.funding') ELSE CAST('[]' AS JSON) END)) AS g
            WHERE json_type(g.value) = 'OBJECT'
          ),
          rel AS (
            SELECT g_iri, 'supports' AS kind, 'http://purl.org/cerif/frapo/supports' AS pred, (CASE WHEN (CASE WHEN json_type(b.value) = 'OBJECT' THEN json_extract_string(b.value, '$.local_identifier') ELSE json_extract_string(b.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(b.value) = 'OBJECT' THEN json_extract_string(b.value, '$.local_identifier') ELSE json_extract_string(b.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(b.value) = 'OBJECT' THEN json_extract_string(b.value, '$.local_identifier') ELSE json_extract_string(b.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(b.value) = 'OBJECT' THEN json_extract_string(b.value, '$.local_identifier') ELSE json_extract_string(b.value, '$') END)) END) AS val
            FROM grs, json_each((CASE WHEN json_type(json_extract(gr, '$.beneficiaries')) = 'ARRAY' THEN json_extract(gr, '$.beneficiaries') ELSE CAST('[]' AS JSON) END)) AS b
            UNION ALL
            SELECT g_iri, 'keyword', 'http://prismstandard.org/namespaces/basic/2.0/keyword', json_extract_string(k.value, '$')
            FROM grs, json_each((CASE WHEN json_type(json_extract(gr, '$.keywords')) = 'ARRAY' THEN json_extract(gr, '$.keywords') ELSE CAST('[]' AS JSON) END)) AS k
            UNION ALL
            SELECT g_iri || '/duration', 'duration', 'http://www.ontologydesignpatterns.org/cp/owl/timeinterval.owl#hasIntervalStartDate', json_extract_string(gr, '$.duration.start')
            FROM grs WHERE json_type(json_extract(gr, '$.duration')) = 'OBJECT'
            UNION ALL
            SELECT g_iri || '/duration', 'duration', 'http://www.ontologydesignpatterns.org/cp/owl/timeinterval.owl#hasIntervalEndDate', json_extract_string(gr, '$.duration.end')
            FROM grs WHERE json_type(json_extract(gr, '$.duration')) = 'OBJECT'
          )
          SELECT DISTINCT pred, val,
                 CASE WHEN kind = 'duration' THEN g_iri ELSE '' END AS s_interval,
                 CASE WHEN kind = 'duration' AND (CASE WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') THEN 'd' WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}T') THEN 'dt' ELSE 'other' END) = 'd' THEN g_iri ELSE '' END AS s_d,
                 CASE WHEN kind = 'duration' AND (CASE WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') THEN 'd' WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}T') THEN 'dt' ELSE 'other' END) = 'dt' THEN g_iri ELSE '' END AS s_dt,
                 CASE WHEN kind = 'duration' AND (CASE WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') THEN 'd' WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}T') THEN 'dt' ELSE 'other' END) = 'other' THEN g_iri ELSE '' END AS s_other,
                 CASE WHEN kind = 'supports' THEN g_iri ELSE '' END AS s_iri,
                 CASE WHEN kind = 'keyword' THEN g_iri ELSE '' END AS s_lit
          FROM rel WHERE val IS NOT NULL
    s: $(s_interval)
    po:
      - [a, ti:TimeInterval]

  grant_duration_date:
    sources: *grant_rel_src
    s: $(s_d)
