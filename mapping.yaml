          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the highest-priority source
          -- (OpenCitations, then OpenAIRE, then GoTriple)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 WHEN 'openaire' THEN 1 ELSE 2 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                     -- offsets keep manifestation/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                     CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          mfs AS (
            SELECT w_iri, prio, mf.value AS m,
                   w_iri || '/manifestation/' || CAST(CAST(mf.key AS INTEGER) + 1 + m_off AS VARCHAR) AS m_iri,
                   json_extract(mf.value, '$.biblio.in') AS vv
            FROM works, json_each(p, '$.manifestations') AS mf WHERE json_type(mf.value) = 'OBJECT'
          ),
          d AS (
            SELECT m_iri, (CASE dk.key
              WHEN 'acceptance' THEN 'http://purl.org/dc/terms/dateAccepted'
              WHEN 'access' THEN 'http://purl.org/spar/fabio/hasAccessDate'
              WHEN 'copyright' THEN 'http://purl.org/dc/terms/dateCopyrighted'
              WHEN 'correction' THEN 'http://purl.org/spar/fabio/hasCorrectionDate'
              WHEN 'creation' THEN 'http://purl.org/dc/terms/created'
              WHEN 'collected' THEN 'http://purl.org/spar/fabio/hasDateCollected'
              WHEN 'received' THEN 'http://purl.org/spar/fabio/hasDateReceived'
              WHEN 'decision' THEN 'http://purl.org/spar/fabio/hasDecisionDate'
              WHEN 'deposit' THEN 'http://purl.org/spar/fabio/hasDepositDate'
              WHEN 'embargo' THEN 'http://purl.org/spar/fabio/hasEmbargoDate'
              WHEN 'modified' THEN 'http://purl.org/dc/terms/modified'
              WHEN 'distribution' THEN 'http://purl.org/spar/fabio/hasDistributionDate'
              WHEN 'publication' THEN 'http://purl.org/dc/terms/issued'
              WHEN 'request' THEN 'http://purl.org/spar/fabio/hasRequestDate'
              WHEN 'retraction' THEN 'http://purl.org/spar/fabio/hasRetractionDate'
              WHEN 'validity' THEN 'http://purl.org/dc/terms/valid'
            END) AS pred, json_extract_string(dv.value, '$') AS val
            FROM mfs,
                 json_each(m, '$.dates') AS dk,
                 json_each((CASE WHEN json_type(dk.value) = 'ARRAY' THEN dk.value WHEN dk.value IS NULL THEN CAST('[]' AS JSON) ELSE json_array(dk.value) END)) AS dv
          ),
          k AS (
            SELECT m_iri, pred, val,
                   (CASE WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}T') THEN 'dt'
                         WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}-[0-9]{2}$') THEN 'd'
                         WHEN regexp_matches(val, '^[0-9]{4}-[0-9]{2}$') THEN 'ym'
                         WHEN regexp_matches(val, '^[0-9]{4}$') THEN 'y'
                         ELSE 'other' END) AS kind
            FROM d WHERE pred IS NOT NULL AND val IS NOT NULL
          )
          SELECT pred, val,
                 CASE WHEN kind = 'dt' THEN m_iri ELSE '' END AS s_dt,
                 CASE WHEN kind = 'd' THEN m_iri ELSE '' END AS s_d,
                 CASE WHEN kind = 'ym' THEN m_iri ELSE '' END AS s_ym,
                 CASE WHEN kind = 'y' THEN m_iri ELSE '' END AS s_y,
                 CASE WHEN kind = 'other' THEN m_iri ELSE '' END AS s_other
          FROM k
    s: $(s_dt)
    po:
      - p: $(pred)
        o:
          value: $(val)
          datatype: xsd:dateTime
 
