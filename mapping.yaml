                 COALESCE(CAST((CASE WHEN COALESCE(json_extract_string(m, '$.license'), json_extract_string(m, '$.licence')) LIKE 'http://%' OR COALESCE(json_extract_string(m, '$.license'), json_extract_string(m, '$.licence')) LIKE 'https://%' THEN regexp_extract(COALESCE(json_extract_string(m, '$.license'), json_extract_string(m, '$.licence')), '^(https?://[^\s<>"]+)', 1) ELSE 'https://example.org/skg-if/data/' || url_encode(COALESCE(json_extract_string(m, '$.license'), json_extract_string(m, '$.licence'))) END) AS VARCHAR), '') AS license
