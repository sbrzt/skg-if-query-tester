  text_en:
    sources: &lang_src
      - query: |
          WITH src AS (
            SELECT lower(json_extract_string(j.json, '$.doi')) AS doi, s.key AS srck, s.value AS p
            FROM read_json_objects('data.json', format='auto') AS j,
                 json_each(j.json, '$.sources') AS s
          ),
          -- one record = the same product described by several sources (matched by DOI):
          -- all sources share one work IRI, taken from the highest-priority source
          -- (OpenCitations, then OpenAIRE, then GoTriple)
          works0 AS (
            SELECT p, srck, (CASE srck WHEN 'opencitations' THEN 0 WHEN 'openaire' THEN 1 ELSE 2 END) AS prio,
                   (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END) AS own_iri,
                   COALESCE(doi, (CASE WHEN json_extract_string(p, '$.local_identifier') LIKE 'http://%' OR json_extract_string(p, '$.local_identifier') LIKE 'https://%' THEN json_extract_string(p, '$.local_identifier') ELSE 'https://example.org/skg-if/data/' || url_encode(json_extract_string(p, '$.local_identifier')) END)) AS rec
            FROM src
          ),
          works AS (
            SELECT p, srck, prio, own_iri, rec,
                   FIRST_VALUE(own_iri) OVER (PARTITION BY rec ORDER BY prio, srck) AS w_iri,
                     -- offsets keep manifestation/contribution numbering unique across sources
                   CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.manifestations'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS m_off,
                     CAST(COALESCE(SUM(COALESCE(json_array_length(p, '$.contributions'), 0)) OVER (PARTITION BY rec ORDER BY prio, srck ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0) AS INTEGER) AS c_off
            FROM works0
          ),
          mfs AS (
            SELECT w_iri, prio, mf.value AS m,
                   w_iri || '/manifestation/' || CAST(CAST(mf.key AS INTEGER) + 1 + m_off AS VARCHAR) AS m_iri,
                   json_extract(mf.value, '$.biblio.in') AS vv
            FROM works, json_each(p, '$.manifestations') AS mf WHERE json_type(mf.value) = 'OBJECT'
          ),
          grs AS (
            SELECT w_iri, g.value AS gr, (CASE WHEN (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) LIKE 'http://%' OR (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) LIKE 'https://%' THEN (CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END) ELSE 'https://example.org/skg-if/data/' || url_encode((CASE WHEN json_type(g.value) = 'OBJECT' THEN json_extract_string(g.value, '$.local_identifier') ELSE json_extract_string(g.value, '$') END)) END) AS g_iri
            FROM works, json_each((CASE WHEN json_type(json_extract(p, '$.funding')) = 'ARRAY' THEN json_extract(p, '$.funding') ELSE CAST('[]' AS JSON) END)) AS g
            WHERE json_type(g.value) = 'OBJECT'
          ),
          txt AS (
            SELECT w_iri AS subj, 'http://purl.org/dc/terms/title' AS pred, l.key AS lang, json_extract_string(t.value, '$') AS txt, prio
            FROM works, json_each(p, '$.titles') AS l, json_each((CASE WHEN json_type(l.value) = 'ARRAY' THEN l.value WHEN l.value IS NULL THEN CAST('[]' AS JSON) ELSE json_array(l.value) END)) AS t
            UNION ALL
            SELECT w_iri, 'http://purl.org/dc/terms/abstract', l.key, json_extract_string(t.value, '$'), prio
            FROM works, json_each(p, '$.abstracts') AS l, json_each((CASE WHEN json_type(l.value) = 'ARRAY' THEN l.value WHEN l.value IS NULL THEN CAST('[]' AS JSON) ELSE json_array(l.value) END)) AS t
            UNION ALL
            SELECT json_extract_string(m, '$.type.class'), 'http://www.w3.org/2004/02/skos/core#prefLabel', l.key, json_extract_string(t.value, '$'), prio
            FROM mfs, json_each(m, '$.type.labels') AS l, json_each((CASE WHEN json_type(l.value) = 'ARRAY' THEN l.value WHEN l.value IS NULL THEN CAST('[]' AS JSON) ELSE json_array(l.value) END)) AS t
            UNION ALL
            SELECT g_iri, 'http://purl.org/dc/terms/title', l.key, json_extract_string(t.value, '$'), 0
            FROM grs, json_each((CASE WHEN json_type(json_extract(gr, '$.titles')) = 'OBJECT' THEN json_extract(gr, '$.titles') ELSE CAST('[]' AS JSON) END)) AS l, json_each((CASE WHEN json_type(l.value) = 'ARRAY' THEN l.value WHEN l.value IS NULL THEN CAST('[]' AS JSON) ELSE json_array(l.value) END)) AS t
            UNION ALL
            SELECT g_iri, 'http://purl.org/dc/terms/abstract', l.key, json_extract_string(t.value, '$'), 0
            FROM grs, json_each((CASE WHEN json_type(json_extract(gr, '$.abstracts')) = 'OBJECT' THEN json_extract(gr, '$.abstracts') ELSE CAST('[]' AS JSON) END)) AS l, json_each((CASE WHEN json_type(l.value) = 'ARRAY' THEN l.value WHEN l.value IS NULL THEN CAST('[]' AS JSON) ELSE json_array(l.value) END)) AS t
          ),
          -- the same text from several sources is kept once (ignoring case, accents, spacing and
          -- punctuation), preferring a language-tagged copy, then the highest-priority source
          txtd AS (
            SELECT * FROM txt
            WHERE subj IS NOT NULL AND txt IS NOT NULL AND lower(txt) <> 'unidentified'
            QUALIFY ROW_NUMBER() OVER (
              PARTITION BY subj, pred, regexp_replace(lower(strip_accents(txt)), '[[:punct:][:space:]]', '', 'g')
              ORDER BY (lang = 'none'), prio, lang) = 1
          )
          SELECT pred, txt,
                 CASE WHEN lang = 'en' THEN subj ELSE '' END AS s_en,
                 CASE WHEN lang = 'it' THEN subj ELSE '' END AS s_it,
                 CASE WHEN lang = 'fr' THEN subj ELSE '' END AS s_fr,
                 CASE WHEN lang = 'de' THEN subj ELSE '' END AS s_de,
                 CASE WHEN lang = 'es' THEN subj ELSE '' END AS s_es,
                 CASE WHEN lang = 'pt' THEN subj ELSE '' END AS s_pt,
                 CASE WHEN lang = 'nl' THEN subj ELSE '' END AS s_nl,
                 CASE WHEN lang = 'ru' THEN subj ELSE '' END AS s_ru,
                 CASE WHEN lang = 'zh' THEN subj ELSE '' END AS s_zh,
                 CASE WHEN lang = 'ja' THEN subj ELSE '' END AS s_ja,
                 CASE WHEN lang = 'none' THEN subj ELSE '' END AS s_none,
                 CASE WHEN lang NOT IN ('en', 'it', 'fr', 'de', 'es', 'pt', 'nl', 'ru', 'zh', 'ja', 'none') THEN subj ELSE '' END AS s_other
          FROM txtd
    s: $(s_en)
    po:
      - p: $(pred)
        o:
          value: $(txt)
          language: en
 
